397 311.68149783144526 L516 307.5 L509.17980382352397 303.31850216855474\" fill=\"none\" stroke=\"#A8BBB0\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/g>\u003cg data-step=\"2\" style=\"--delay:500ms\">\u003cpath d=\"M596.5 303.05 L626.76 332.42 L685.5 273.68\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003ctext x=\"641\" y=\"417.5\" dominant-baseline=\"central\" text-anchor=\"middle\" font-family=\"Microsoft YaHei,sans-serif\" font-size=\"28\" fill=\"#F1F5F0\" font-weight=\"700\">质量评分\u003c/text>\u003cpath d=\"M765 307.5 L913 307.5\" fill=\"none\" stroke=\"#A8BBB0\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M906.1798038235239 311.68149783144526 L913 307.5 L906.1798038235239 303.31850216855474\" fill=\"none\" stroke=\"#A8BBB0\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/g>\u003cg data-step=\"3\" style=\"--delay:900ms\">\u003cpath d=\"M1038 279.02 L1038 335.98\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M993.5 294.15 L1027.32 294.15\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M1020.4998038235238 298.33149783144523 L1027.32 294.15 L1020.4998038235238 289.9685021685547\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M1082.5 320.85 L1048.68 320.85\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M1055.500196176476 316.66850216855477 L1048.68 320.85 L1055.500196176476 325.0314978314453\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003ctext x=\"1038\" y=\"417.5\" dominant-baseline=\"central\" text-anchor=\"middle\" font-family=\"Microsoft YaHei,sans-serif\" font-size=\"28\" fill=\"#F1F5F0\" font-weight=\"700\">自动选参\u003c/text>\u003c/g>\u003c/svg>","steps":3,"base":"./previews-outline/base-04.png"},{"title":"图片与文档，也能更小","seconds":16,"appendix":false,"script":"图片通过图像编码优化；PDF 结合结构和图像处理；普通 Word 文档处理内嵌的图片和视频。不同格式使用不同的校验方式，文档还需要检查整个包与打开效果，不能把所有格式都讲成同一种质量评分。","image":"./previews-outline/slide-05.png","svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1280 720\" aria-hidden=\"true\">\u003cg data-step=\"1\" style=\"--delay:100ms\">\u003cpath d=\"M201 260 L263.64 260 L289.15999999999997 285.52 L289.15999999999997 376 L201 376 Z\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M263.64 260 L263.64 285.52 L289.15999999999997 285.52\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cellipse cx=\"226.4852\" cy=\"306.69\" rx=\"6.09\" ry=\"6.09\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\"/>\u003cpath d=\"M216.8688 348.15999999999997 L238.0272 324.96000000000004 L250.3696 336.56 L269.7648 315.68\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003ctext x=\"246\" y=\"444\" dominant-baseline=\"central\" text-anchor=\"middle\" font-family=\"Microsoft YaHei,sans-serif\" font-size=\"35\" fill=\"#ACD4B8\" font-weight=\"700\">图片\u003c/text>\u003ctext x=\"246\" y=\"515.5\" dominant-baseline=\"central\" text-anchor=\"middle\" font-family=\"Microsoft YaHei,sans-serif\" font-size=\"27\" fill=\"#A8BBB0\" font-weight=\"400\">优化图像编码\u003c/text>\u003c/g>\u003cg data-step=\"2\" style=\"--delay:500ms\">\u003cpath d=\"M595 260 L657.64 260 L683.16 285.52 L683.16 376 L595 376 Z\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M657.64 260 L657.64 285.52 L683.16 285.52\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoi entral\" text-anchor=\"middle\" font-family=\"Microsoft YaHei,sans-serif\" font-size=\"27\" fill=\"#A8BBB0\" font-weight=\"400\">压缩内嵌图片与视频\u003c/text>\u003c/g>\u003c/svg>","steps":3,"base":"./previews-outline/base-05.png"},{"title":"软件删了，残留可能还在","seconds":15,"appendix":false,"script":"卸载软件后，缓存、日志、临时文件和其他残留仍可能占空间。Arkive 基于开源工具 Mole 的能力，在本地发现这些内容，减少手动逐个寻找的成本。这里没有取得真实系统清理的新数据，所以不显示“本次释放”数字。","image":"./previews-outline/slide-06.png","svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1280 720\" aria-hidden=\"true\">\u003cg data-step=\"1\" style=\"--delay:100ms\">\u003cpath d=\"M143 342.648 L178.51999999999998 342.648 L189.07999999999998 352.296 L239 352.296 L239 397.32 L143 397.32 Z\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003ctext x=\"191\" y=\"482.5\" dominant-baseline=\"central\" text-anchor=\"middle\" font-family=\"Microsoft YaHei,sans-serif\" font-size=\"29\" fill=\"#F1F5F0\" font-weight=\"700\">缓存\u003c/text>\u003c/g>\u003cg data-step=\"2\" style=\"--delay:500ms\">\u003cpath d=\"M454 327 L500.44 327 L519.36 345.92 L519.36 413 L454 413 Z\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M500.44 327 L500.44 345.92 L519.36 345.92\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M467.072 363.98 L504.9808 363.98\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M467.072 376.02 L504.9808 376.02\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M467.072 388.06 L504.9808 388.06\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003ctext x=\"488\" y=\"482.5\" dominant-baseline=\"central\" text-anchor=\"middle\" font-family=\"Microsoft YaHei,sans-serif\" f 3ctext x=\"1082\" y=\"482.5\" dominant-baseline=\"central\" text-anchor=\"middle\" font-family=\"Microsoft YaHei,sans-serif\" font-size=\"29\" fill=\"#F1F5F0\" font-weight=\"700\">卸载残留\u003c/text>\u003c/g>\u003c/svg>","steps":4,"base":"./previews-outline/base-06.png"},{"title":"不常用的文件，集中存好","seconds":16,"appendix":false,"script":"Backup 暂存压缩前的完整原件，为处理后留出回退余地；Archive 保存可以直接打开的压缩副本。它们是用户目录下并列的两个文件夹，按各自操作日期组织。备份不是要求永久保留，后续按用户选择清理，但自动定期清理还没有实现。","image":"./previews-outline/slide-07.png","svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1280 720\" aria-hidden=\"true\">\u003cg data-step=\"1\" style=\"--delay:100ms\">\u003cpath d=\"M240 270.45 L325.1 270.45 L350.4 291.9 L470 291.9 L470 392 L240 392 Z\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003ctext x=\"355\" y=\"438.5\" dominant-baseline=\"central\" text-anchor=\"middle\" font-family=\"Microsoft YaHei,sans-serif\" font-size=\"31\" fill=\"#ACD4B8\" font-weight=\"700\">Arkive Backup\u003c/text>\u003ctext x=\"355\" y=\"496\" dominant-baseline=\"central\" text-anchor=\"middle\" font-family=\"Microsoft YaHei,sans-serif\" font-size=\"27\" fill=\"#A8BBB0\" font-weight=\"400\">暂存完整原件\u003c/text>\u003c/g>\u003cg data-step=\"2\" style=\"--delay:500ms\">\u003cpath d=\"M804 270.45 L889.1 270.45 L914.4 291.9 L1034 291.9 L1034 392 L804 392 Z\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003ctext x=\"919\" y=\"438.5\" dominant-baseline=\"central\" text-anchor=\"middle\" font-family=\"Microsoft YaHei,sans-serif\" font-size=\"31\" fill=\"#ACD4B8\" font-weight=\"700\">Arkive Archive\u003c/text>\u003ctext x=\"919\" y=\"496\" dominant-baseline=\"central\" text-anchor=\"middle\" font-family=\"Microsoft YaHei,sans-serif\" font-size=\"27\" fill=\"#A8BBB0\" font-weight=\"400\">保存压缩副本\u003c/text>\u003c/g>\u003c/svg>","steps":2,"base":"./previews-outline/base-07.png"},{"title":"记得关键词，就有查找线索","seconds":18,"appendix":false,"script":"即使忘了完整文件名，人也可能记得活动、人物或年份。Arkive 使用 macOS 原生 Finder 标签，提供预设、已有和自定义名称，并按多个标签同时筛选。原生标签还可被有相应能力和权限的其他工具或 Agent 复用。AI 标签推荐已有独立函数，但资料采集与推荐界面尚未联动。","image":"./previews-outline/slide-08.png","svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1280 720\" aria-hidden=\"true\">\u003cg data-step=\"1\" style=\"--delay:100ms\">\u003crect x=\"168\" y=\"307\" width=\"176\" height=\"61\" rx=\"26\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\"/>\u003ctext x=\"256\" y=\"337.5\" dominant-baseline=\"central\" text-anchor=\"middle\" font-family=\"Microsoft YaHei,sans-serif\" font-size=\"27\" fill=\"#ACD4B8\" font-weight=\"700\">演唱会\u003c/text>\u003ctext x=\"430.5\" y=\"336\" dominant-baseline=\"central\" text-anchor=\"middle\" font-family=\"Microsoft YaHei,sans-serif\" font-size=\"31\" fill=\"#A8BBB0\" font-weight=\"400\">＋\u003c/text>\u003c/g>\u003cg data-step=\"2\" style=\"--delay:500ms\">\u003crect x=\"553\" y=\"307\" width=\"176\" height=\"61\" rx=\"26\" fill=\"none\" stroke=\"#AFBFDF\" stroke-width=\"2\"/>\u003ctext x=\"641\" y=\"337.5\" dominant-baseline=\"central\" text-anchor=\"middle\" font-family=\"Microsoft YaHei,sans-serif\" font-size=\"27\" fill=\"#AFBFDF\" font-weight=\"700\">歌手\u003c/text>\u003ctext x=\"815.5\" y=\"336\" dominant-baseline=\"central\" text-anchor=\"middle\" font-family=\"Microsoft YaHei,sans-serif\" font-size=\"31\" fill=\"#A8BBB0\" font-weight=\"400\">＋\u003c/text>\u003c/g>\u003cg data-step=\"3\" style=\"--delay:900ms\">\u003crect x=\"938\" y=\"307\" width=\"176\" height=\"61\" rx=\"26\" fill=\"none\" stroke=\"#D5C6A4\" stroke-width=\"2\"/>\u003ctext x=\"1026\" y=\"337.5\" dominant-baseline=\"central\" text-anchor=\"middle\" font-family=\"Microsoft YaHei,sans-serif\" font-size=\"27\" fill=\"#D5C6A4\" font-weight=\"700\">年份\u003c/text>\u003c/g>\u003cg data-step=\"4\" style=\"--delay:1300ms\">\u003cellipse cx=\"616.09\" cy=\"445.09\" rx=\"24.09\" ry=\"24.09\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"3\"/>\u003cpath d=\"M633.61 462.61 L658.4300000000001 487.43\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M695 455 L840 455\" fill=\"none\" stroke=\"#A8BBB0\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M833.1798038235239 459.18149783144526 L840 455 L833.1798038235239 450.81850216855474\" fill=\"none\" stroke=\"#A8BBB0\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M922 402 L976 402 L998 424 L998 502 L922 502 Z\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M976 402 L976 424 L998 424\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M948.6 441 L948.6 474 L975.2 457 Z\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/g>\u003c/svg>","steps":4,"base":"./previews-outline/base-08.png"},{"title":"再找一些空间","seconds":12,"appendix":false,"script":"工具箱把进一步挖掘空间的能力放在一起：APFS 去重让相同内容共享存储；占用分析帮助定位大文件；项目清理发现可以重新构建或下载的产物。它们的界面与业务接入状态要分别说明，不能因为底层工具存在就认为所有按钮流程都已经验收。","image":"./previews-outline/slide-09.png","svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1280 720\" aria-hidden=\"true\">\u003cg data-step=\"1\" style=\"--delay:100ms\">\u003cpath d=\"M100 237 L134.01999999999998 237 L147.88 250.86 L147.88 300 L100 300 Z\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M134.01999999999998 237 L134.01999999999998 250.86 L147.88 250.86\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M109.576 264.09 L137.34640000000002 264.09\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M109.576 272.91 L137.34640 .24 498.688 L189 498.688 L189 539.96 L101 539.96 Z\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003ctext x=\"241\" y=\"510.5\" dominant-baseline=\"central\" text-anchor=\"start\" font-family=\"Microsoft YaHei,sans-serif\" font-size=\"31\" fill=\"#F1F5F0\" font-weight=\"700\">项目清理：移除可重建产物\u003c/text>\u003c/g>\u003c/svg>","steps":3,"base":"./previews-outline/base-09.png"},{"title":"不知道怎么用？直接说","seconds":18,"appendix":false,"script":"用户可以说，旧项目太大，帮我整理。Agent 通过选定的业务工具检查占用、推荐方案，在用户授权后执行。我们希望把具体场景组织成 Skill，让工具层承接设备和格式的特化；场景 Skill 当前还没有接入应用。","image":"./previews-outline/slide-10.png","svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1280 720\" aria-hidden=\"true\">\u003cg data-step=\"1\" style=\"--delay:100ms\">\u003cellipse cx=\"236.86\" cy=\"534.86\" rx=\"13.860000000000001\" ry=\"13.860000000000001\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"3\"/>\u003cpath d=\"M246.94 544.94 L261.22 559.22\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003ctext x=\"244\" y=\"601.5\" dominant-baseline=\"central\" text-anchor=\"middle\" font-family=\"Microsoft YaHei,sans-serif\" font-size=\"24\" fill=\"#F1F5F0\" font-weight=\"700\">检查占用\u003c/text>\u003cpath d=\"M368 542 L516 542\" fill=\"none\" stroke=\"#A8BBB0\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M509.17980382352397 546.1814978314453 L516 542 L509.17980382352397 537.8185021685547\" fill=\"none\" stroke=\"#A8BBB0\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/g>\u003cg data-step=\"2\" style=\"--delay:500ms\">\u003cpath d=\"M620 521 L642.68 521 L651.92 530.24 L651.92 563 L620 563 Z\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M642.68 521 L642.68 530.24 L651.92 530.24\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M626.384 539.06 L644.8976 539.06\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M626.384 544.94 L644.8976 544.94\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M626.384 550.82 L644.8976 550.82\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003ctext x=\"641\" y=\"601.5\" dominant-baseline=\"central\" text-anchor=\"middle\" font-family=\"Microsoft YaHei,sans-serif\" font-size=\"24\" fill=\"#F1F5F0\" font-weight=\"700\">推荐方案\u003c/text>\u003cpath d=\"M765 542 L913 542\" fill=\"none\" stroke=\"#A8BBB0\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M906.1798038235239 546.1814978314453 L913 542 L906.1798038235239 537.8185021685547\" fill=\"none\" stroke=\"#A8BBB0\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/g>\u003cg data-step=\"3\" style=\"--delay:900ms\">\u003cpath d=\"M1017 539.9 L1031.28 553.76 L1059 526.04\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003ctext x=\"1038\" y=\"601.5\" dominant-baseline=\"central\" text-anchor=\"middle\" font-family=\"Microsoft YaHei,sans-serif\" font-size=\"24\" fill=\"#F1F5F0\" font-weight=\"700\">授权执行\u003c/text>\u003c/g>\u003c/svg>","steps":3,"base":"./previews-outline/base-10.png"},{"title":"让普通人用好这些能力","seconds":15,"appendix":false,"script":"Arkive 自主做的，是围绕节省空间这一目标，组织普通人能完成的流程。简单窗口降低使用多种工具的成本，对话入口帮助用户探索问题，再通过已经接入的业务工具执行。视频选参、大疆素材特化、原件与归档管理，是流程落地的具体工作。","image":"./previews-outline/slide-11.png","svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1280 720\" aria-hidden=\"true\">\u003cg data-step=\"1\" style=\"--delay:100ms\">\u003crect x=\"198\" y=\"267.6768\" width=\"96\" height=\"16.128\" rx=\"3\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\"/>\u003cpath d=\"M205.68 283.8048 L205.68 338.64 L286.32 338.64 L286.32 283.8048\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M234.48000000000002 304.7712 L257.52 304.7712\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003ctext x=\"246\" y=\"439.5\" dominant-baseline=\"central\" text-anchor=\"middle\" font-family=\"Microsoft YaHei,sans-serif\" font-size=\"29\" fill=\"#ACD4B8\" font-weight=\"700\">围绕节省空间\u003c/text>\u003ctext x=\"246\" y=\"502.5\" dominant-baseline=\"central\" text-anchor=\"middle\" font-family=\"Microsoft YaHei,sans-serif\" font-size=\"29\" fill=\"#A8BBB0\" font-weight=\"400\">串成完整流程\u003c/text>\u003c/g>\u003cg data-step=\"2\" style=\"--delay:500ms\">\u003crect x=\"592\" y=\"258\" width=\"96\" height=\"65.28\" rx=\"5\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\"/>\u003cpath d=\"M640 323.28 L640 346.32\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M615.04 346.32 L664.96 346.32\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003ctext x=\"640\" y=\"439.5\" dominant-baseline=\"central\" text-anchor=\"middle\" font-family=\"Microsoft YaHei,sans-serif\" font-size=\"29\" fill=\"#ACD4B8\" font-weight=\"700\">拖拽操作\u003c/text>\u003ctext x=\"640\" y=\"502.5\" dominant-baseline=\"central\" text-anchor=\"middle\" font-family=\"Microsoft YaHei,sans-serif\" font-size=\"29\" fill=\"#A8BBB0\" font-weight=\"400\">简单窗口\u003c/text>\u003c/g>\u003cg data-step=\"3\" style=\"--delay:900ms\">\u003crect x=\"986\" y=\"258\" width=\"96\" height=\"61.44\" rx=\"8\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\"/>\u003cpath d=\"M1007.12 319.44 L1007.12 338.64 L1027.28 319.44\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\ 自动适配所有软件。","image":"./previews-outline/slide-15.png","svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1280 720\" aria-hidden=\"true\">\u003cg data-step=\"1\" style=\"--delay:100ms\">\u003crect x=\"208\" y=\"246.16\" width=\"76\" height=\"49.4\" rx=\"6\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\"/>\u003cellipse cx=\"246\" cy=\"269.72\" rx=\"12.920000000000002\" ry=\"12.920000000000002\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\"/>\u003cpath d=\"M219.4 246.16 L224.72 234 L242.2 234 L246 246.16\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003ctext x=\"246\" y=\"365\" dominant-baseline=\"central\" text-anchor=\"middle\" font-family=\"Microsoft YaHei,sans-serif\" font-size=\"27\" fill=\"#F1F5F0\" font-weight=\"700\">摄影照片\u003c/text>\u003cpath d=\"M602 234 L643.04 234 L659.76 250.72 L659.76 310 L602 310 Z\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M643.04 234 L643.04 250.72 L659.76 250.72\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M622.216 263.64 L622.216 288.72 L642.432 275.8 Z\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003ctext x=\"640\" y=\"365\" dominant-baseline=\"central\" text-anchor=\"middle\" font-family=\"Microsoft YaHei,sans-serif\" font-size=\"27\" fill=\"#F1F5F0\" font-weight=\"700\">会议录像\u003c/text>\u003cpath d=\"M996 234 L1037.04 234 L1053.76 250.72 L1053.76 310 L996 310 Z\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M1037.04 234 L1037.04 250.72 L1053.76 250.72\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M1007.552 266.68 L1041.0528 266.68\" fill=\"none\" stroke=\"#ACD4B8\" stroke-width=\"2\" ","steps":3,"base":"./previews-outline/base-18.png"},{"title":"已有工程验证","seconds":0,"appendix":true,"script":"依据 2026 年 10 月 17 日 Windows 修复与回归报告，29 项队列、解析和路径保护测试，加 5 项文件操作回归，共 34 项单元测试通过；30 项综合功能检查通过；7 项限制或待实现单独保留。这些结果来自已有的 Windows 回归报告，不能代替 macOS 专项验收。","image":"./previews-outline/slide-19.png"},{"title":"功能状态与验证范围","seconds":0,"appendix":true,"script":"这里分别说明已有能力与待接入方向。当前副本存在版本差异，演示和删除行为应以最终交付构建的提示为准。","image":"./previews-outline/slide-20.png"},{"title":"自主设计与开源基础","seconds":0,"appendix":true,"script":"Arkive 自主设计的是产品交互、跨入口业务编排、文件保护与状态管理、APFS 去重事务和恢复。编解码器、重复检测、Agent 框架等来自第三方。分发工具的版本、来源、哈希和许可记录在 manifest 与 licenses 目录；本页只用于说明技术来源，不替代完整的第三方声明。","image":"./previews-outline/slide-21.png"}];let current=0,all=false,renderToken=0,fade=null;const pref=matchMedia('(prefers-reduced-motion: reduce)');let motion=!pref.matches;try{const saved=localStorage.getItem('arkive-pitch-motion');if(saved!==null&&!pref.matches)motion=saved==='true'}catch{}const limit=()=>all?data.length:17;
async function draw(){const version=++renderToken,s=data[current],playing=motion&&!pref.matches,src=playing&&s.svg?s.base:s.image;document.getElementById('title').textContent=s.title;document.getElementById('counter').textContent=(s.appendix?'备用 ':'主讲 ')+(current+1)+' / '+limit()+(s.seconds?' · '+s.seconds+'s':'');document.getElementById('script').textContent=s.script;document.querySelectorAll('.thumb').forEach((b,i)=>{b.hidden=!all&&i>=17;b.setAttribute('aria-current',String(i===current))});document.getElementById('motion').setAttribute('aria-pressed',String(playing));document.getElementById('motion').textContent='动效：'+(playing?'开':'关');const preload=new Image();preload.src=src;try{await preload.decode()}catch{}if(version!==renderToken)return;document.getElementById('slide').src=src;document.getElementById('slide').alt=s.title;document.getElementById('overlay').innerHTML=playing&&s.svg?s.svg:'';if(fade)fade.cancel();if(playing)fade=document.querySelector('.stage').animate([{opacity:.75},{opacity:1}],{duration:180,easing:'ease-out'});}
function move(n){current=(current+n+limit())%limit();draw()}function mode(v){all=v;document.getElementById('all').setAttribute('aria-pressed',String(all));document.getElementById('main-only').setAttribute('aria-pressed',String(!all));if(current>=limit())current=0;draw()}function toggleMotion(){motion=!motion;try{localStorage.setItem('arkive-pitch-motion',String(motion))}catch{}draw()}document.getElementById('main-only').onclick=()=>mode(false);document.getElementById('all').onclick=()=>mode(true);document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.getElementById('motion').onclick=toggleMotion;document.getElementById('replay').onclick=draw;document.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>{current=+b.dataset.page;draw()});async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{document.getElementById('fullscreen').textContent='使用浏览器全屏'}}document.getElementById('fullscreen').onclick=fullscreen;pref.addEventListener('change',draw);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();move(1)}if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}if(e.key.toLowerCase()==='f')fullscreen();if(e.key.toLowerCase()==='r')draw();if(e.key.toLowerCase()==='m')toggleMotion()});draw();
